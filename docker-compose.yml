# Local development stack — builds from source and mirrors the production
# topology (nginx in front of gunicorn) so you can catch proxy problems on
# your laptop instead of on the app server.
#
#   docker compose up --build      →  http://localhost:8080
#
# The app server runs a DIFFERENT compose file: one that pulls a published
# image rather than building, templated by Ansible from
# ansible/roles/appserver/templates/docker-compose.yml.j2

services:
  web:
    build:
      context: ./app
      args:
        APP_VERSION: local
    container_name: weather-app-web
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_VERSION: local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: weather-app-nginx
    restart: unless-stopped
    ports:
      # 8080 locally to avoid needing root for port 80.
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
