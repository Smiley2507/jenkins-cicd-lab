---
# Ships Jenkins' own log to CloudWatch Logs.
#
# The container log driver cannot help here: Jenkins runs as a systemd service
# on the host, not as a container, so its output never passes through Docker.
# That is what the CloudWatch agent is for — it tails files on disk and pushes
# the lines to a log group.
#
# Credentials come from the EC2 instance profile (ec2_observability). There are
# no access keys on this host.

# --- make Jenkins write a file ---------------------------------------------
# The Jenkins RPM logs to the systemd journal. The CloudWatch agent tails
# FILES, not the journal, so we redirect the unit's stdout/stderr to a file as
# well. Without this the agent runs happily and ships nothing, which is the
# worst kind of failure: silent.

- name: Ensure the Jenkins log directory exists
  ansible.builtin.file:
    path: /var/log/jenkins
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"

- name: Ensure the systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# A drop-in rather than editing jenkins.service directly: the packaged unit
# file is replaced on every Jenkins upgrade, a drop-in survives it.
- name: Redirect Jenkins output to a log file
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/10-logfile.conf
    content: |
      [Service]
      StandardOutput=append:/var/log/jenkins/jenkins.log
      StandardError=append:/var/log/jenkins/jenkins.log
    owner: root
    group: root
    mode: "0644"
  register: jenkins_logfile

# Only when the drop-in actually changed — this restarts Jenkins, so it must
# not happen on every run. Any build in progress would be killed.
- name: Reload systemd and restart Jenkins
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
    daemon_reload: true
  when: jenkins_logfile.changed

- name: Wait for Jenkins to come back up
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/login
    status_code: [200]
    timeout: 10
  register: jenkins_up
  retries: 30
  delay: 5
  until: jenkins_up is succeeded
  when: jenkins_logfile.changed

# --- the agent --------------------------------------------------------------

- name: Install the CloudWatch agent
  ansible.builtin.dnf:
    name: amazon-cloudwatch-agent
    state: present

- name: Write the agent configuration
  ansible.builtin.template:
    src: amazon-cloudwatch-agent.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    owner: root
    group: root
    mode: "0644"
  register: cw_agent_config

# The agent is driven through its own control wrapper, not systemctl. This one
# command loads the config, enables the service and starts it, so it replaces
# both an `enable` and a `start` task.
- name: Load the configuration and start the agent
  ansible.builtin.command:
    cmd: >-
      /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
      -a fetch-config -m ec2 -s
      -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
  when: cw_agent_config.changed
  changed_when: true

- name: Ensure the agent is enabled and running
  ansible.builtin.systemd:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true

# --- verification -----------------------------------------------------------

- name: Confirm Jenkins is writing to the log file
  ansible.builtin.stat:
    path: "{{ cw_agent_log_file }}"
  register: jenkins_log_stat

- name: Fail early if the log file is missing or empty
  ansible.builtin.assert:
    that:
      - jenkins_log_stat.stat.exists
      - jenkins_log_stat.stat.size > 0
    fail_msg: >-
      {{ cw_agent_log_file }} is missing or empty, so the CloudWatch agent has
      nothing to ship. Check `journalctl -u jenkins` and whether the systemd
      drop-in took effect.