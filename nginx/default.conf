
upstream app_server {
    # "web" is the compose service name; Docker's embedded DNS resolves it.
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://app_server;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /health {
        proxy_pass http://app_server/health;
        proxy_set_header Host $host;
        access_log off;
    }


    # --- observability -----------------------------------------------------

    # Prometheus scrape target for the application's own metrics.
    # Restricted to the VPC: the monitoring server reaches nginx on port 80
    # from a 10.20.1.x address, so nginx sees the real client IP here.
    # Without the allow/deny this would expose internals to the internet.
    location /metrics {
        allow 10.20.0.0/16;
        deny all;

        proxy_pass http://app_server/metrics;
        proxy_set_header Host $host;
        access_log off;
    }

    # nginx's own connection statistics, consumed by nginx-prometheus-exporter.
    #
    # NOTE: the exporter runs as a container on the same Docker network, so the
    # client address nginx sees is the Docker bridge (172.16.0.0/12), NOT a
    # 10.20.x address. Allowing only the VPC CIDR here would return 403.
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        access_log off;
    }

    # nginx's own liveness, answered without touching the app. Lets you tell
    # "proxy is down" apart from "app is down" during a failed deploy.
    location /nginx-health {
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}