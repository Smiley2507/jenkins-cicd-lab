# Reverse proxy in front of gunicorn.
#
# This file is the single source of truth. Ansible copies it onto the app
# server at /opt/weather-app/nginx/default.conf, where the nginx container
# bind-mounts it read-only. Editing it on the host will be overwritten on the
# next playbook run — change it here and re-run Ansible.

upstream app_server {
    # "web" is the compose service name; Docker's embedded DNS resolves it.
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # The app returns small HTML pages; compress them.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://app_server;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Open-Meteo is usually fast, but don't hang a worker forever if it isn't.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Health endpoint, kept out of the access log so probes don't drown it.
    location /health {
        proxy_pass http://app_server/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # nginx's own liveness, answered without touching the app. Lets you tell
    # "proxy is down" apart from "app is down" during a failed deploy.
    location /nginx-health {
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
